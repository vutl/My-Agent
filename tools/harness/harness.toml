# Agent harness configuration (docs/handoff/10-AGENT-HARNESS.md).
# Aya's own models stay on 9router; nothing here goes through 9router.

[binaries]
# "auto": PATH first, then the VS Code extension bundles.
codex = "auto"
claude = "auto"

# Dedicated homes: ~/.codex belongs to the IDE extension, whose logins can
# switch accounts under the harness.
[[accounts]]
name = "vutlpro"
codex_home = "~/.codex-vutlpro"

[[accounts]]
name = "uclab"
codex_home = "~/.codex-uclab"

[roles.planner]
fallback = "planner_opus"
engine = "claude"
model = "fable"
permission_mode = "plan"

[roles.planner_opus]
# Fallback when Fable needs usage credits.
engine = "claude"
model = "opus"
permission_mode = "plan"

[roles.planner_codex]
# Fallback planner when Claude quota is out.
engine = "codex"
model = "gpt-6.1-sol"
sandbox = "read-only"
effort = "high"

[roles.plan_review]
fallback = "reviewer_claude"
engine = "codex"
model = "gpt-6-astra"
sandbox = "read-only"
effort = "high"

[roles.executor]
mcp = ["graphify", "context7"]
fallback = "coder_claude"
engine = "codex"
model = "gpt-6.1-sol"
sandbox = "workspace-write"
effort = "high"

[roles.coder]
mcp = ["graphify", "context7"]
fallback = "coder_claude"
engine = "codex"
model = "gpt-6-luna"
sandbox = "workspace-write"
effort = "medium"

[roles.coder_claude]
engine = "claude"
model = "sonnet"
permission_mode = "acceptEdits"

[roles.reviewer]
fallback = "reviewer_claude"
engine = "codex"
model = "gpt-6-astra"
sandbox = "read-only"
effort = "high"

[roles.judge]
# Claude quota is separate from the GPT accounts Aya answers with; judging on
# Sonnet keeps all GPT quota for Aya. gpt-6-astra is the fallback.
engine = "claude"
model = "sonnet"
permission_mode = "plan"
fallback = "judge_codex"

[roles.judge_codex]
engine = "codex"
model = "gpt-6-astra"
sandbox = "read-only"
effort = "medium"

[roles.reviewer_claude]
# Fallback reviewer/judge when both Codex accounts are out.
engine = "claude"
model = "sonnet"
permission_mode = "plan"

[roles.variant_author]
# Writes generalisation variants of a fixed failure; never the fix author.
engine = "codex"
model = "gpt-6-astra"
sandbox = "read-only"
effort = "high"
fallback = "reviewer_claude"

[roles.scout]
engine = "claude"
model = "haiku"
permission_mode = "plan"

# Antigravity models through 9router (Claude Opus/Sonnet 5.5 on the user's
# Antigravity account): spare the Codex accounts and the Claude subscription.
# Each falls back to the matching Codex/Claude role when the gateway fails.
[roles.planner_ag]
engine = "claude"
gateway = "9router"
model = "ag/claude-opus-5-5-high"
permission_mode = "plan"
fallback = "planner_codex"

[roles.executor_ag]
engine = "claude"
gateway = "9router"
model = "ag/claude-opus-5-5-high"
permission_mode = "acceptEdits"
fallback = "executor"

[roles.coder_ag]
engine = "claude"
gateway = "9router"
model = "ag/claude-sonnet-5-5-high"
permission_mode = "acceptEdits"
fallback = "coder"

[roles.reviewer_ag]
engine = "claude"
gateway = "9router"
model = "ag/claude-opus-5-5"
permission_mode = "plan"
fallback = "reviewer"

[roles.judge_ag]
engine = "claude"
gateway = "9router"
model = "ag/claude-sonnet-5-5"
permission_mode = "plan"
fallback = "judge"

[roles.scout_ag]
engine = "claude"
gateway = "9router"
model = "ag/claude-sonnet-5-5"
permission_mode = "plan"
fallback = "scout"

[gateways.9router]
# Anthropic-compatible endpoint; the token is Aya's 9router key in backend/.env.
base_url = "http://127.0.0.1:20128"
token_env = "NINEROUTER_API_KEY"
token_file = "backend/.env"
token_key = "OPENAI_API_KEY"

[codex]
# Harness calls skip the user config (13 IDE plugins, priority service tier)
# and enable only the MCP servers a role lists in `mcp`.
ignore_user_config = true

[tests]
# Run from the repository (or worktree) root; {python} is the main repo venv.
command = "cd backend && PYTHONPATH=.. {python} -m pytest -q -p no:cacheprovider"
