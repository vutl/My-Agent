[project]
name = "my-ai-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the Mac-first local AI agent app."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0",
    "pydantic>=2.8.0",
    "pypdf>=6.0.0",
    "pymupdf>=1.24.0",
    "docling>=2.50.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
vector = [
    "lancedb>=0.17.0",
]
rerank = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
]
embedding-eval = [
    "sentence-transformers>=5.6.1",
    "transformers>=4.45,<5",
    "einops>=0.8.0",
]
vn = [
    "pyvi>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
